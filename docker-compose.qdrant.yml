services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    container_name: qdrant-vector-db
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - ./temp/qdrant_data/snapshots:/qdrant/snapshots
      - ./temp/qdrant_data/temp:/qdrant/temp
      - ./temp/qdrant_data:/qdrant/storage
      - ./qdrant-config.yml:/qdrant/config/production.yaml:ro
    mem_limit: 4g
    mem_reservation: 512m
    cpus: 2.0
